<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>启信分详情</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.8/dist/chart.umd.min.js"></script>
    <style>
        .score-circle {
            background: conic-gradient(#ef4444 0% 36.2%, #e5e7eb 36.2% 100%);
        }
        .radar-canvas {
            width: 220px !important;
            height: 220px !important;
        }
    </style>
</head>
<body class="bg-white text-gray-800 font-sans">
    <div class="w-[980px] border border-gray-200 rounded shadow-sm bg-white">
        <!-- 头部 -->
        <div class="flex justify-between items-center p-4 border-b border-gray-200">
            <div class="flex items-center gap-3">
                <div class="score-circle w-14 h-14 rounded-full flex items-center justify-center relative">
                    <div class="w-12 h-12 bg-white rounded-full flex flex-col items-center justify-center">
                        <span class="text-red-500 text-xl font-bold">362</span>
                        <span class="text-xs text-gray-500">启信分</span>
                    </div>
                </div>
                <div>
                    <div class="text-lg font-semibold">启信分评估</div>
                    <div class="flex items-center gap-2 mt-1">
                        <span class="text-red-500 font-bold text-lg">一般</span>
                        <span class="text-gray-500 text-sm">优于全国研究和试验发展中38%的企业</span>
                        <span class="text-gray-400 text-sm">更新时间: 2026-08-22 <i class="fa fa-info-circle"></i></span>
                    </div>
                </div>
            </div>
            <button class="text-gray-400 text-xl">×</button>
        </div>

        <!-- 信用等级 -->
        <div class="p-4 border-b border-gray-200">
            <div class="flex justify-between items-center mb-3">
                <div class="flex items-center gap-1">
                    <span class="font-medium">信用等级</span>
                    <i class="fa fa-question-circle text-gray-400 text-sm"></i>
                </div>
                <a href="#" class="text-blue-500 text-sm">等级介绍 ></a>
            </div>
            <!-- 色条 -->
            <div class="relative h-4 w-full rounded overflow-hidden flex">
                <div class="bg-green-400 w-[8%]"></div>
                <div class="bg-green-300 w-[8%]"></div>
                <div class="bg-yellow-200 w-[8%]"></div>
                <div class="bg-yellow-300 w-[8%]"></div>
                <div class="bg-orange-200 w-[8%]"></div>
                <div class="bg-orange-300 w-[8%]"></div>
                <div class="bg-orange-400 w-[8%]"></div>
                <div class="bg-red-300 w-[8%]"></div>
                <div class="bg-red-400 w-[8%]"></div>
                <div class="bg-red-500 w-[8%]"></div>
                <div class="bg-red-600 w-[8%]"></div>
                <div class="bg-red-700 w-[8%]"></div>
            </div>
            <!-- 刻度 -->
            <div class="flex justify-between text-xs text-gray-500 mt-1">
                <span>1000</span>
                <span>767</span>
                <span>737</span>
                <span>705</span>
                <span>677</span>
                <span>657</span>
                <span>617</span>
                <span>571</span>
                <span>533</span>
                <span>488</span>
                <span>436</span>
                <span>408</span>
                <span>368</span>
                <span>324</span>
                <span>281</span>
                <span>200</span>
            </div>
            <!-- 悬浮提示 -->
            <div class="absolute ml-[65%] -mt-8 bg-gray-800 text-white text-xs px-2 py-1 rounded whitespace-nowrap">
                R13 信用风险较高，存在很大风险，很容易无法满足偿付
            </div>
        </div>

        <!-- 评分趋势 -->
        <div class="p-4 border-b border-gray-200">
            <div class="flex justify-between items-center mb-3">
                <div class="flex items-center gap-1">
                    <span class="font-medium">评分趋势</span>
                    <i class="fa fa-question-circle text-gray-400 text-sm"></i>
                </div>
                <div class="flex gap-3">
                    <select class="border border-gray-300 rounded px-2 py-1 text-sm">
                        <option>按周</option>
                        <option>按月</option>
                    </select>
                    <div class="flex items-center border border-gray-300 rounded px-2 py-1 text-sm gap-2">
                        <span>开始日期</span>
                        <input type="text" class="border-none outline-none w-20">
                        <span>-</span>
                        <input type="text" class="border-none outline-none w-20">
                        <span>结束日期</span>
                    </div>
                </div>
            </div>
            <div class="h-[240px] relative">
                <canvas id="trendChart"></canvas>
            </div>
        </div>

        <!-- 评分指标 雷达+表格 -->
        <div class="p-4 flex gap-6">
            <!-- 雷达图 -->
            <div class="w-[240px]">
                <div class="font-medium mb-3">评分指标 <i class="fa fa-question-circle text-gray-400 text-sm"></i></div>
                <canvas id="radarChart" class="radar-canvas"></canvas>
            </div>
            <!-- 右侧表格 -->
            <div class="flex-1">
                <table class="w-full border-collapse">
                    <thead>
                        <tr class="bg-gray-100">
                            <th class="border border-gray-300 px-3 py-2 text-left text-sm font-medium">企业实力</th>
                            <th class="border border-gray-300 px-3 py-2 text-left text-sm font-medium">行业排名</th>
                            <th class="border border-gray-300 px-3 py-2 text-left text-sm font-medium">排名情况</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td class="border border-gray-300 px-3 py-2 text-sm">成长性 <i class="fa fa-question-circle text-gray-400 text-xs"></i></td>
                            <td class="border border-gray-300 px-3 py-2 text-sm">优于行业21%的企业</td>
                            <td class="border border-gray-300 px-3 py-2 text-sm">一般</td>
                        </tr>
                        <tr>
                            <td class="border border-gray-300 px-3 py-2 text-sm">知识产权 <i class="fa fa-question-circle text-gray-400 text-xs"></i></td>
                            <td class="border border-gray-300 px-3 py-2 text-sm">优于行业99%的企业</td>
                            <td class="border border-gray-300 px-3 py-2 text-sm text-green-600">优秀</td>
                        </tr>
                        <tr>
                            <td class="border border-gray-300 px-3 py-2 text-sm">企业规模 <i class="fa fa-question-circle text-gray-400 text-xs"></i></td>
                            <td class="border border-gray-300 px-3 py-2 text-sm">优于行业99%的企业</td>
                            <td class="border border-gray-300 px-3 py-2 text-sm text-green-600">优秀</td>
                        </tr>
                        <tr>
                            <td class="border border-gray-300 px-3 py-2 text-sm">经营质量 <i class="fa fa-question-circle text-gray-400 text-xs"></i></td>
                            <td class="border border-gray-300 px-3 py-2 text-sm">优于行业99%的企业</td>
                            <td class="border border-gray-300 px-3 py-2 text-sm text-green-600">优秀</td>
                        </tr>
                        <tr>
                            <td class="border border-gray-300 px-3 py-2 text-sm">资本背景 <i class="fa fa-question-circle text-gray-400 text-xs"></i></td>
                            <td class="border border-gray-300 px-3 py-2 text-sm">优于行业96%的企业</td>
                            <td class="border border-gray-300 px-3 py-2 text-sm text-green-600">优秀</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        // 趋势图
        const trendCtx = document.getElementById('trendChart').getContext('2d');
        new Chart(trendCtx, {
            type: 'line',
            data: {
                labels: ['08-25至08-31', '10-20至10-26', '12-15至12-21', '02-09至02-15', '04-07至04-13', '06-02至06-08', '07-28至08-03'],
                datasets: [{
                    label: '启信分',
                    data: [362, 362, 362, 362, 362, 362, 362],
                    borderColor: '#3b82f6',
                    backgroundColor: 'rgba(59, 130, 246, 0.2)',
                    fill: true,
                    tension: 0
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                scales: {
                    y: {
                        min: 0,
                        max: 450,
                        ticks: [0, 162, 200, 250, 300, 350, 400, 450]
                    }
                },
                plugins: { legend: { display: false } }
            }
        });

        // 雷达图
        const radarCtx = document.getElementById('radarChart').getContext('2d');
        new Chart(radarCtx, {
            type: 'radar',
            data: {
                labels: ['成长性', '知识产权', '企业规模', '经营质量', '资本背景'],
                datasets: [{
                    data: [30, 95, 95, 95, 90],
                    borderColor: '#3b82f6',
                    backgroundColor: 'rgba(59, 130, 246, 0.3)',
                    fill: true
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                scales: {
                    r: { min: 0, max: 100 }
                },
                plugins: { legend: { display: false } }
            }
        });
    </script>
</body>
</html>
